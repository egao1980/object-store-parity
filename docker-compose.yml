services:
  seaweedfs:
    # All-in-one master+volume+filer+S3. The image entrypoint expects the
    # first argument to be `server` and adds -dir=/data itself.
    image: chrislusf/seaweedfs:4.48
    command:
      - server
      - -s3
      - -s3.port=9000
      - -s3.config=/etc/seaweedfs/s3.json
      - -ip.bind=0.0.0.0
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -s3.iam=false
    ports:
      - "9000:9000"
    volumes:
      - ./s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && wget -q -S -O /dev/null http://127.0.0.1:9000/ 2>&1 | grep -q 403",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 8s
